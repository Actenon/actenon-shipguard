name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned dependencies + package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          npm install -g tsx

      - name: Diagnostics (fails if a mandatory prerequisite like tsx is missing)
        run: actenon-shipguard doctor

      - name: Assert tsx prerequisite resolvable (no silent all-skip)
        run: |
          python -c "from actenon_shipguard.cli import _find_tsx; import sys; p=_find_tsx(None); print('tsx:', p); sys.exit(0 if p else 1)"

      - name: Core security tests (trust boundary + adapters + Sentinel acceptance logic)
        # The real-Sentinel-CLI integration tests run in the dedicated sentinel-integration job
        # (they need the pinned Sentinel build); they are deselected here so they cannot silently skip.
        run: |
          pytest -q -rs -m "not sentinel_integration" | tee /tmp/pytest.txt
          grep -qE "[1-9][0-9]* passed" /tmp/pytest.txt
          if grep -qE "skipped" /tmp/pytest.txt; then echo "ERROR: tests were skipped (missing prerequisite)"; exit 1; fi

      - name: Deterministic offline demo (reduced trials for CI)
        run: actenon-shipguard demo --out /tmp/sg-demo --trials 20000

      - name: Confirm demo verdict
        run: |
          test -f /tmp/sg-demo/demo-summary.json
          grep -q '"decision": "ALLOW"' /tmp/sg-demo/demo-summary.json

      - name: Build wheel + clean NON-EDITABLE install + demo from unrelated cwd
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install -q dist/*.whl
          mkdir -p /tmp/unrelated-cwd && cd /tmp/unrelated-cwd
          SHIPGUARD_TSX="$(command -v tsx)" /tmp/wheelenv/bin/actenon-shipguard doctor
          SHIPGUARD_TSX="$(command -v tsx)" /tmp/wheelenv/bin/actenon-shipguard demo --out /tmp/wheel-demo --trials 5000
          grep -q '"decision": "ALLOW"' /tmp/wheel-demo/demo-summary.json
          echo "wheel non-editable install + demo from unrelated cwd: OK"

  sentinel-integration:
    # Proves the REAL Sentinel verifier integration end-to-end: structured receipts, a contradicted
    # wrong fix, and the full offline repair loop (contradiction -> counterexample -> re-verification).
    runs-on: ubuntu-latest
    env:
      SENTINEL_COMMIT: becba502c8dbebdd5e52b8ca09122f86e4e37bb3
      SHIPGUARD_SENTINEL: /tmp/sentinel-verified/dist/cli.js
      SHIPGUARD_NODE_MODULES: /tmp/sentinel-verified/node_modules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"        # Sentinel engines: ^22.12 || ^24 || >=26

      - name: Install shipguard
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Provision pinned Sentinel verifier (build from the exact commit)
        run: |
          git clone --quiet https://github.com/rossbuckley1990-hash/sentinel-verified.git /tmp/sentinel-verified
          cd /tmp/sentinel-verified
          git checkout --quiet "$SENTINEL_COMMIT"
          npm ci --quiet
          npm run build --quiet
          test -f dist/cli.js && echo "sentinel built at $SENTINEL_COMMIT"

      - name: Assert Sentinel resolvable (no silent skip)
        run: |
          python -c "from actenon_shipguard.sentinel import find_sentinel; import sys; p=find_sentinel(); print('sentinel:', p); sys.exit(0 if p else 1)"

      - name: Real Sentinel integration tests (must run, not skip)
        run: |
          pytest -q -rs -m sentinel_integration | tee /tmp/it.txt
          grep -qE "[1-9][0-9]* passed" /tmp/it.txt
          if grep -qE "skipped" /tmp/it.txt; then echo "ERROR: integration tests skipped (sentinel missing)"; exit 1; fi
