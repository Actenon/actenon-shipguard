name: ci

on:
  push:
    branches: [main, v0.2.0, bde-discovery-v0.3.0]
    tags: ["v*"]
  pull_request:
    branches: [main, bde-discovery-v0.3.0]

# `shell: bash` makes every run step use `bash -eo pipefail`, so a failing command inside a pipe
# (e.g. `pytest ... | tee`) propagates its non-zero status instead of being masked by tee's exit 0.
# Mandatory test steps additionally set `set -euo pipefail` explicitly and assert on the exit code.
defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20.20.2", "22.23.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py311
        with:
          python-version: "3.11"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pinned dependencies + package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          npm install -g tsx@4.20.6

      - name: Diagnostics (fails if a mandatory prerequisite like tsx is missing)
        run: |
          set -euo pipefail
          actenon-shipguard doctor

      - name: Assert tsx prerequisite resolvable (no silent all-skip)
        run: |
          set -euo pipefail
          python -c "from actenon_shipguard.cli import _find_tsx; import sys; p=_find_tsx(None); print('tsx:', p); sys.exit(0 if p else 1)"

      - name: Core security tests (trust boundary + adapters + Sentinel acceptance logic)
        env:
          SHIPGUARD_PYTHON311: ${{ steps.py311.outputs.python-path }}
        # The real-Sentinel-CLI integration tests run in the dedicated sentinel-integration job
        # (they need the pinned Sentinel build); they are deselected here so they cannot silently skip.
        run: |
          set -euo pipefail
          set +e
          pytest -q -rs -m "not sentinel_integration and not bde_containment" 2>&1 | tee /tmp/pytest.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "pytest exit code: $code"
          test "$code" -eq 0 || { echo "ERROR: pytest failed (exit $code)"; exit "$code"; }
          grep -qE "[1-9][0-9]* passed" /tmp/pytest.txt
          if grep -qE "skipped" /tmp/pytest.txt; then echo "ERROR: tests were skipped (missing prerequisite)"; exit 1; fi

      - name: Deterministic offline demo (reduced trials for CI)
        run: |
          set -euo pipefail
          actenon-shipguard demo --out /tmp/sg-demo --trials 20000

      - name: BDE behavioural discovery smoke test (CLI end-to-end on a hermetic defective fixture)
        # Builds a minimal fixture repository whose documented example crashes (the ufo
        # parseFilename defect shape), then requires `shipguard discover` to confirm it.
        run: |
          set -euo pipefail
          mkdir -p /tmp/bde-smoke/src && cd /tmp/bde-smoke
          git init -q && git config user.email ci@actenon.local && git config user.name ci
          cat > src/index.ts <<'TS'
          /** Parses and returns the last path segment.
           * @example
           * ```js
           * lastSegment("/a/b/file.txt");
           * // -> "file.txt"
           * ```
           */
          export function lastSegment(input = "", { strict }): string | undefined {
            const m = input.match(/\/([^/]+)$/);
            return m ? m[1] : undefined;
          }
          TS
          cat > README.md <<'MD'
          # smoke

          ### `lastSegment(input)`

          **Example:**

          ```js
          // -> "file.txt"
          lastSegment("/a/b/file.txt");
          ```
          MD
          printf '{"name":"smoke","version":"1.0.0","type":"module","private":true}' > package.json
          git add -A && git commit -qm smoke
          set +e
          shipguard discover --module src/index.ts --out /tmp/bde-out --allow-local | tee /tmp/bde-discover.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "discover exit code: $code (expect 1: confirmed contradiction)"
          test "$code" -eq 1
          grep -q "CONFIRMED_CONTRADICTION" /tmp/bde-discover.txt
          grep -q "documented call threw" /tmp/bde-discover.txt
          test -f /tmp/bde-out/bde-evidence.json
          test -f /tmp/bde-out/bde-report.html
          python "$GITHUB_WORKSPACE/scripts/assert_bde_smoke.py" /tmp/bde-out
          echo "BDE discover smoke: OK"

      - name: Confirm demo verdict
        run: |
          set -euo pipefail
          test -f /tmp/sg-demo/demo-summary.json
          grep -q '"decision": "ALLOW"' /tmp/sg-demo/demo-summary.json

      - name: Build wheel + clean NON-EDITABLE install + demo from unrelated cwd
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install -q dist/*.whl
          mkdir -p /tmp/unrelated-cwd && cd /tmp/unrelated-cwd
          SHIPGUARD_TSX="$(command -v tsx)" /tmp/wheelenv/bin/actenon-shipguard doctor
          SHIPGUARD_TSX="$(command -v tsx)" /tmp/wheelenv/bin/actenon-shipguard demo --out /tmp/wheel-demo --trials 5000
          grep -q '"decision": "ALLOW"' /tmp/wheel-demo/demo-summary.json
          echo "wheel non-editable install + demo from unrelated cwd: OK"
          # Exercise the BDE runner shipped IN the wheel, from an unrelated cwd.
          set +e
          SHIPGUARD_TSX="$(command -v tsx)" /tmp/wheelenv/bin/shipguard discover --repo /tmp/bde-smoke --module src/index.ts --out /tmp/wheel-bde --allow-local > /tmp/wheel-bde.txt
          code=$?
          set -e
          cat /tmp/wheel-bde.txt
          test "$code" -eq 1
          python "$GITHUB_WORKSPACE/scripts/assert_bde_smoke.py" /tmp/wheel-bde

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-py${{ matrix.python-version }}-node${{ matrix.node-version }}
          path: |
            /tmp/pytest.txt
            /tmp/bde-out/
            /tmp/wheel-bde/
            /tmp/sg-demo/demo-summary.json
            /tmp/wheel-demo/demo-summary.json

  sentinel-integration:
    # Proves the REAL Sentinel verifier integration end-to-end: structured receipts, evidence
    # integrity, a contradicted wrong fix, and the full offline repair loop.
    runs-on: ubuntu-latest
    env:
      SENTINEL_COMMIT: becba502c8dbebdd5e52b8ca09122f86e4e37bb3
      SHIPGUARD_SENTINEL: /tmp/sentinel-verified/dist/cli.js
      SHIPGUARD_NODE_MODULES: /tmp/sentinel-verified/node_modules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"        # Sentinel engines: ^22.12 || ^24 || >=26

      - name: Install shipguard
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Provision pinned Sentinel verifier (build from the exact commit)
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/rossbuckley1990-hash/sentinel-verified.git /tmp/sentinel-verified
          cd /tmp/sentinel-verified
          git checkout --quiet "$SENTINEL_COMMIT"
          npm ci --quiet
          npm run build --quiet
          test -f dist/cli.js && echo "sentinel built at $SENTINEL_COMMIT"

      - name: Assert Sentinel resolvable (no silent skip)
        run: |
          set -euo pipefail
          python -c "from actenon_shipguard.sentinel import find_sentinel; import sys; p=find_sentinel(); print('sentinel:', p); sys.exit(0 if p else 1)"

      - name: Real Sentinel integration tests (must run, not skip)
        run: |
          set -euo pipefail
          set +e
          pytest -q -rs -m sentinel_integration 2>&1 | tee /tmp/it.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "pytest exit code: $code"
          test "$code" -eq 0 || { echo "ERROR: pytest failed (exit $code)"; exit "$code"; }
          grep -qE "[1-9][0-9]* passed" /tmp/it.txt
          if grep -qE "skipped" /tmp/it.txt; then echo "ERROR: integration tests skipped (sentinel missing)"; exit 1; fi


  bde-containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned containment runtime and install test dependencies
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          docker build -t shipguard-bde-ci docker/bde
          echo "SHIPGUARD_BDE_IMAGE=$(docker image inspect shipguard-bde-ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Independent containment negative controls (no skips)
        run: |
          set -euo pipefail
          set +e
          pytest -q -rs -m bde_containment | tee /tmp/containment.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 0 || exit "$code"
          grep -qE "[1-9][0-9]* passed" /tmp/containment.txt
          if grep -qE "skipped" /tmp/containment.txt; then exit 1; fi
